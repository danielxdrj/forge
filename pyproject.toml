[project]
name = "forge-core"
version = "0.20.0"
description = "Forge Core: núcleo do Forge (monólito modular, sem integrações)."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
forge-tasks = "forge_core.draft.cli:main"
forge-resolver = "forge_core.resolver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forge_core = [
    "storage/migrations/*/*.sql",
    "storage/provisioning/*.sql",
]

[tool.pytest.ini_options]
testpaths = ["tests/core"]
pythonpath = ["src"]
