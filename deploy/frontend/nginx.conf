# forge_frontend: estáticos + reverse-proxy /api/ (origem única no navegador).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; font-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-store" always;

    location /api/ {
        proxy_pass http://forge_backend:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Access-Control-Allow-Origin;
        # O rascunho via Cursor CLI pode levar até 120 s (DEFAULT_TIMEOUT); folga acima disso.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /conexoes {
        try_files /conexoes.html =404;
    }

    location ~* \.woff2$ {
        default_type font/woff2;
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
