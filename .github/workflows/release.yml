name: Release

# Roda a cada push na branch padrão. Mantém aberto um "PR de release" com a
# próxima versão e o CHANGELOG. Ao mergear esse PR, cria a tag e a GitHub Release.
# Como funciona, como desativar e o procedimento manual: docs/RELEASES.md

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    # Chave de desativação sem alterar código: defina a variável de repositório
    # RELEASE_AUTOMATION_ENABLED como "false" (Settings > Secrets and variables > Actions > Variables).
    if: ${{ vars.RELEASE_AUTOMATION_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
