<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if pending %}<meta http-equiv="refresh" content="3">{% endif %}
  <title>Forge — entrar</title>
</head>
<body>
  <h1>Forge</h1>
  {% if error %}<p>{{ error }}</p>{% endif %}
  {% if pending %}
    <p>Abra <a href="{{ verification_uri }}">{{ verification_uri }}</a> e informe o código:</p>
    <p><strong>{{ user_code }}</strong></p>
    <p>Aguardando autorização no GitHub…</p>
  {% else %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit">Entrar com GitHub</button>
    </form>
  {% endif %}
</body>
</html>
