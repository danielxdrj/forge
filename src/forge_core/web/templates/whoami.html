<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forge — sessão</title>
</head>
<body>
  <h1>Forge</h1>
  <p>Login: <strong>{{ login }}</strong></p>
  <p>Identidade: <code>{{ identity }}</code></p>
  <p>Papéis: {% if roles %}{{ roles | join(", ") }}{% else %}nenhum{% endif %}</p>
  {% if "editor" not in roles %}
    <p>Sem papel editor. O owner não implica editor; peça <code>grant --role editor</code>.</p>
  {% endif %}
  <form method="post" action="/logout">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button type="submit">Sair</button>
  </form>
</body>
</html>
