# LEGADO: frontend/backend da primeira implementação. Não é o painel do Core.
# Uso atual: docker-compose.forge.yml (ADR-017, docs/operacao/container-local.md).
name: forge_system

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - forge_postgres_data:/var/lib/postgresql/data

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"

volumes:
  forge_postgres_data:
