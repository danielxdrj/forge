# Painel local do Forge Core (ADR-017). Um comando: docker compose -f docker-compose.forge.yml up -d --build
# Grupo no Docker Desktop: `forge`.
#
# Serviços: forge_postgres, forge_backend, forge_frontend.
# Origem do navegador: http://127.0.0.1:8090 (nginx serve a UI e faz proxy de /api/).
# O backend NÃO publica 8091 no host: é só o hop interno na rede compose.
#
# Conflito de porta: o padrão 127.0.0.1:5433 coincide com docker-compose.dev.yml (projeto forge_dev,
# ADR-004). Os dois NÃO podem estar no ar na 5433. Pare o compose de dev ou use FORGE_PG_HOST_PORT.
name: forge

services:
  forge_postgres:
    container_name: forge_postgres
    image: postgres:16-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
    environment:
      POSTGRES_USER: forge_owner
      POSTGRES_DB: forge
      POSTGRES_PASSWORD_FILE: /run/secrets/forge_pg_owner_password
    secrets:
      - forge_pg_owner_password
      - forge_pg_app_password
      - forge_pg_readonly_password
    volumes:
      - forge_pgdata:/var/lib/postgresql/data
      - ./deploy/web/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${FORGE_PG_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge_owner -d forge"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  forge_backend:
    container_name: forge_backend
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
    read_only: true
    tmpfs:
      - /tmp
      - /run/secrets:mode=0700,uid=1000,gid=1000,size=1m
    depends_on:
      forge_postgres:
        condition: service_healthy
    environment:
      FORGE_CONFIG_DIR: /etc/forge/config
      FORGE_GITHUB_CLIENT_ID: ${FORGE_GITHUB_CLIENT_ID:?defina FORGE_GITHUB_CLIENT_ID}
      FORGE_PG_HOST: forge_postgres
      FORGE_PG_PORT: "5432"
      FORGE_PG_DB: forge
      FORGE_PG_OWNER_USER: forge_owner
      FORGE_PG_APP_USER: forge_app
      FORGE_PG_READONLY_USER: forge_readonly
      FORGE_PG_OWNER_PASSWORD: ${FORGE_PG_OWNER_PASSWORD:?defina FORGE_PG_OWNER_PASSWORD}
      FORGE_PG_APP_PASSWORD: ${FORGE_PG_APP_PASSWORD:?defina FORGE_PG_APP_PASSWORD}
      FORGE_SECRET_OWNER_PASSWORD_FILE: /run/secrets/forge_pg_owner_password
      FORGE_SECRET_APP_PASSWORD_FILE: /run/secrets/forge_pg_app_password
      FORGE_TRUST_FORWARDED: "true"
      FORGE_TRUSTED_PROXIES: forge_frontend
      FORGE_WEB_HOSTS: "127.0.0.1:${FORGE_FRONTEND_HOST_PORT:-8090},localhost:${FORGE_FRONTEND_HOST_PORT:-8090},127.0.0.1:8091,localhost:8091"
      FORGE_SESSION_TTL_SECONDS: ${FORGE_SESSION_TTL_SECONDS:-604800}
      HOME: /home/forge
      XDG_CONFIG_HOME: /home/forge/.config
      XDG_DATA_HOME: /home/forge/.local/share
    volumes:
      - forge_cli_home:/home/forge
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  forge_frontend:
    container_name: forge_frontend
    build:
      context: .
      dockerfile: deploy/frontend/Dockerfile
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    depends_on:
      - forge_backend
    ports:
      - "127.0.0.1:${FORGE_FRONTEND_HOST_PORT:-8090}:8080"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

secrets:
  forge_pg_owner_password:
    environment: FORGE_PG_OWNER_PASSWORD
  forge_pg_app_password:
    environment: FORGE_PG_APP_PASSWORD
  forge_pg_readonly_password:
    environment: FORGE_PG_READONLY_PASSWORD

volumes:
  forge_pgdata:
  forge_cli_home:
